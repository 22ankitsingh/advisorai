version: "3.9"

services:
  advisor_ai:
    build:
      context: .
      dockerfile: Dockerfile
      target: app
    container_name: advisor_ai
    ports:
      - "8501:8501"
    volumes:
      # Persist DB, ChromaDB vectors, and logs across container restarts
      - ./data:/app/data
      - ./logs:/app/logs
    env_file:
      - .env
    environment:
      - APP_ENV=production
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
